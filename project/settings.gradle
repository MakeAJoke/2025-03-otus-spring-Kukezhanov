pluginManagement {
    plugins {
        id "io.spring.dependency-management" version settings.dependencyManagement
        id "org.springframework.boot" version settings.springframeworkBoot
        id 'name.remal.sonarlint' version settings.sonarlint
        id 'com.diffplug.spotless' version settings.spotless
    }
}

rootProject.name = "project"